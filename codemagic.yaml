workflows:
  ios-testflight:
    name: Corgi Hop — iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: corgi_hop_apple

    environment:
      xcode: 26.6
      node: 20
      cocoapods: default

      groups:
        - corgi_hop_ios_public_keys
        - corgi_hop_public_urls

      vars:
        BUNDLE_ID: com.corgihop.game
        APP_STORE_APPLE_ID: "6794865915"
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        XCODE_CONFIG: Release
        MARKETING_VERSION: 1.0.0

      ios_signing:
        certificates:
          - corgi_hop_distribution
        provisioning_profiles:
          - corgi_hop_app_store

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Verify build environment
        script: |
          set -euo pipefail
          echo "Repository root: $CM_BUILD_DIR"
          node --version
          yarn --version
          xcodebuild -version
          sw_vers

      - name: Install JavaScript dependencies
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/frontend"
          yarn install --frozen-lockfile

      - name: Type-check application
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/frontend"
          npx tsc --noEmit

      - name: Create production environment file
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/frontend"

          cat > .env <<EOF
          VITE_APP_ENV=production
          VITE_ENABLE_PRODUCTION_MONETIZATION=false
          VITE_SHOW_TEST_ADS_LABEL=true
          VITE_USE_AD_TEST_IDS=true

          VITE_REVENUECAT_IOS_PUBLIC_KEY=${VITE_REVENUECAT_IOS_PUBLIC_KEY:-}
          VITE_REVENUECAT_ANDROID_PUBLIC_KEY=

          VITE_ADMOB_IOS_APP_ID=${VITE_ADMOB_IOS_APP_ID:-}
          VITE_ADMOB_ANDROID_APP_ID=
          VITE_ADMOB_IOS_REWARDED_ID=${VITE_ADMOB_IOS_REWARDED_ID:-}
          VITE_ADMOB_ANDROID_REWARDED_ID=
          VITE_ADMOB_IOS_INTERSTITIAL_ID=${VITE_ADMOB_IOS_INTERSTITIAL_ID:-}
          VITE_ADMOB_ANDROID_INTERSTITIAL_ID=

          VITE_PRODUCT_REMOVE_ADS=com.corgihop.remove_ads
          VITE_PRODUCT_STARTER_PACK=com.corgihop.starter_pack
          VITE_PRODUCT_PREMIUM_CORGIS=com.corgihop.premium_corgis
          VITE_PRODUCT_ALL_CORGIS=com.corgihop.all_corgis

          VITE_PRIVACY_POLICY_URL=${PRIVACY_POLICY_URL:-}
          VITE_TERMS_URL=${TERMS_URL:-}
          VITE_SUPPORT_URL=${SUPPORT_URL:-}
          EOF

          echo ".env created for TestFlight build."

      - name: Build Vite production bundle
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/frontend"
          yarn vite build
          test -s dist/index.html
          ls -lh dist/index.html

      - name: Sync Capacitor iOS project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/frontend"
          npx cap sync ios
          npx cap ls ios

      - name: Install CocoaPods
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/frontend/ios/App"
          pod install

      - name: Apply App Store signing profile

Paste this in its place:

      - name: Set version and next TestFlight build number
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/frontend/ios/App"

          LATEST_BUILD_NUMBER="$(
            app-store-connect get-latest-testflight-build-number \
              "$APP_STORE_APPLE_ID" \
              --platform IOS \
              --app-store-version "$MARKETING_VERSION"
          )"

          if ! [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid TestFlight build number: $LATEST_BUILD_NUMBER"
            exit 1
          fi

          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))

          echo "Latest TestFlight build: $LATEST_BUILD_NUMBER"
          echo "New TestFlight build: $NEXT_BUILD_NUMBER"
          echo "Marketing version: $MARKETING_VERSION"

          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all "$NEXT_BUILD_NUMBER"

          echo "Confirmed project build number:"
          agvtool what-version
