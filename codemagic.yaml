        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/frontend/ios/App"

          CURRENT_BUILD="$(app-store-connect get-latest-testflight-build-number \
            "$BUNDLE_ID" --platform IOS 2>/dev/null | tr -dc '0-9' || true)"

          if [ -z "$CURRENT_BUILD" ]; then
            CURRENT_BUILD=0
          fi

          NEXT_BUILD=$((CURRENT_BUILD + 1))

          echo "Marketing version: $MARKETING_VERSION"
          echo "Next TestFlight build number: $NEXT_BUILD"

          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all "$NEXT_BUILD"

      - name: Apply App Store signing profile
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/frontend"

          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Archive and export signed IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/frontend"

          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config "$XCODE_CONFIG" \
            --archive-flags "-destination 'generic/platform=iOS'"

      - name: Stage IPA for Codemagic publishing
        script: |
          set -euo pipefail

          SOURCE_DIR="$CM_BUILD_DIR/frontend/build/ios/ipa"
          DEST_DIR="$CM_BUILD_DIR/build/ios/ipa"

          echo "Generated IPA files:"
          find "$SOURCE_DIR" -maxdepth 1 -type f -name "*.ipa" -print -exec ls -lh {} \;

          IPA_COUNT="$(find "$SOURCE_DIR" -maxdepth 1 -type f -name "*.ipa" | wc -l | tr -d ' ')"

          if [ "$IPA_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one IPA, found $IPA_COUNT."
            exit 1
          fi

          SOURCE_IPA="$(find "$SOURCE_DIR" -maxdepth 1 -type f -name "*.ipa" -print -quit)"

          mkdir -p "$DEST_DIR"
          cp -f "$SOURCE_IPA" "$DEST_DIR/CorgiHop.ipa"

          test -s "$DEST_DIR/CorgiHop.ipa"

          echo "Final Codemagic IPA artifact:"
          ls -lh "$DEST_DIR/CorgiHop.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
